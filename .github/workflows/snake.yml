
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate red snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nusrat-Islam
          outputs: |
            dist/snake.svg?color_snake=%23ff0000&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%232161e4

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
